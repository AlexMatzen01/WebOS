<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalOS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="desktop">
    <header id="topbar">
      <strong>LocalOS</strong>
      <span id="clock"></span>
    </header>
    <main id="icon-grid">
      <button class="desktop-icon" data-app="terminal">Terminal</button>
      <button class="desktop-icon" data-app="files">Files</button>
      <button class="desktop-icon" data-app="settings">Settings</button>
      <button class="desktop-icon" data-app="browser">Browser</button>
      <button class="desktop-icon" data-app="editor">Script Editor</button>
      <button class="desktop-icon" data-app="notes">Notes</button>
      <button class="desktop-icon" data-app="tasks">Task Board</button>
      <button class="desktop-icon" data-app="calculator">Calculator</button>
    </main>
  </div>

  <div id="window-layer"></div>

  <aside id="start-menu" class="hidden">
    <input id="start-search" placeholder="Search apps" />
    <div id="start-list"></div>
  </aside>

  <footer id="taskbar">
    <button id="start-btn">Start</button>
    <div id="task-items"></div>
  </footer>

  <template id="window-template">
    <section class="window">
      <div class="window-header">
        <span class="window-title"></span>
        <div class="window-controls">
          <button class="minimize">—</button>
          <button class="close">✕</button>
        </div>
      </div>
      <div class="window-body"></div>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
