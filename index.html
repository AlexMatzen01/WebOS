<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalOS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="lock-screen"></div>
  <div id="desktop">
    <header id="topbar">
      <strong>LocalOS</strong>
      <div class="row mini-actions">
        <button id="desktop-switcher">Desktop</button>
        <button id="open-settings">Settings</button>
        <span id="clock"></span>
      </div>
    </header>
    <main id="icon-grid">
      <button class="desktop-icon" data-app="terminal">Terminal</button>
      <button class="desktop-icon" data-app="files">File Explorer</button>
      <button class="desktop-icon" data-app="browser">Browser</button>
      <button class="desktop-icon" data-app="editor">Text Editor</button>
      <button class="desktop-icon" data-app="taskmgr">Task Manager</button>
      <button class="desktop-icon" data-app="appstudio">App Studio</button>
    </main>
  </div>

  <div id="window-layer"></div>
  <aside id="notifications"></aside>

  <aside id="start-menu" class="hidden">
    <input id="start-search" placeholder="Search apps" />
    <div id="start-list"></div>
  </aside>

  <section id="quick-settings" class="hidden panel quick-settings">
    <h4>System Settings</h4>
    <label>Theme <select id="theme"><option value="dark">Dark</option><option value="midnight">Midnight</option><option value="sunrise">Sunrise</option></select></label>
    <label>Accent <input id="accent" type="color" value="#22d3ee"/></label>
  </section>

  <footer id="taskbar">
    <button id="start-btn">Start</button>
    <div id="task-items"></div>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
